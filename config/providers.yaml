# Adaptive Multi-LLM Router Provider & Capability Registry Configuration

providers:
  openai:
    enabled: true
    adapter: openai
    description: "OpenAI Target & High-Capability Backbone"
    env_key: "OPENAI_API_KEY"
    models:
      - id: "gpt-5.5"
        name: "GPT-5.5"
        is_target: true
        is_free: false
        context_window: 200000
        reasoning_tier: "high"
        coding_tier: "expert"
        structured_output: true
        supports_search: true
        cost_per_1k_input_tokens: 0.005
        cost_per_1k_output_tokens: 0.015

      - id: "gpt-5.4"
        name: "GPT-5.4"
        is_target: true
        is_free: false
        context_window: 128000
